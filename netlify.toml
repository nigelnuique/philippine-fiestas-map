# Netlify — connect this repo in the Netlify dashboard (Build & deploy → Link repository).
# Build clones boundary GeoJSON (gitignored raw sources) then runs the Vite production build.

[build]
  command = "bash scripts/clone-sources.sh && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  VITE_BASE_PATH = "/"
  # Set to your Netlify URL after first deploy, e.g. https://philippine-fiestas.netlify.app
  # VITE_SITE_URL = "https://your-site.netlify.app"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/geojson/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
